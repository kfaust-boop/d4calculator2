<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Diablo 4 calculator</title>
    

  </head>
    
  <body>
  <html>
<head>
    <style>
        body { background-color: #111; color: #eee; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .gear { background-color: #222; border: 1px solid #444; padding: 15px; margin-bottom: 10px; width: 380px; }
        h2 { color: #d32f2f; margin: 0 0 10px 0; font-size: 1.1em; text-align: center; }
        .slot-container { display: flex; align-items: center; margin-top: 8px; }
        .slot-name { color: #aaa; font-weight: bold; font-size: 0.9em; width: 40px; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; padding: 5px; background-color: #333; color: #fff; border: 1px solid #555; border-radius: 4px; width: 180px; cursor: pointer; margin-right: 5px; }
        .btn-tiny { width: 28px; height: 28px; font-size: 14px; cursor: pointer; border: 1px solid #555; background: #444; color: white; margin-left: 2px; padding: 0; display: flex; align-items: center; justify-content: center; }
        .btn-tiny.active { background: #d32f2f; border-color: #fff; }
        /* Disabled but active button should still be clickable to turn off */
        .btn-tiny:disabled { background: #222; color: #555; cursor: not-allowed; border-color: #333; }
        .btn-tiny.active:disabled { background: #d32f2f; color: #fff; cursor: pointer; } 
        #result { margin-top: 20px; padding: 20px; background: #333; border: 2px solid #555; width: 450px; text-align: center; font-size: 1.2em; }
        .bucket { display: inline-block; margin: 0 10px; font-weight: bold; }
        .purple { color: #d6a1ff; } .yellow { color: #ffeb3b; } .blue { color: #2196f3; } .grey { color: #9e9e9e; }
    </style>
</head>
<body>

    <h1>Diablo 4 Damage Calculator</h1>

    <div class="controls">
        <button onclick="applyOptimal()" style="padding: 10px; cursor:pointer; background: #d32f2f; color: white; border: none; font-weight: bold;">Best Option</button>
        <button onclick="toggleGlobalUpgrade()" id="global-btn" style="padding: 10px; cursor:pointer; margin-left: 10px; background: #d32f2f; color: white; border: none;">Upgrade All (+25%)</button>
        <button onclick="switchStats()" id="switch-btn" style="padding: 10px; cursor:pointer; margin-left: 10px; background: #444; color: white; border: none;">Switch to Crit</button>
        <button onclick="clearAll()" style="padding: 10px; cursor:pointer; margin-left: 10px;">Clear All</button>
    </div>

    <div class="container" id="gear-container"></div>
    <div id="result">Select stats to calculate</div>

    <script>
        let isCritMode = false;
        let globalUpgradeActive = true; 
        const baseStats = {
            "Damage Over Time": { normal: 30, amuletGloves: 60 },
            "Vulnerable Damage": { normal: 14, amuletGloves: 28 },
            "Cold Damage": { normal: 10, amuletGloves: 24 },
            "All Damage": { normal: 10, amuletGloves: 20 }
        };

        const gearData = [
            {name: "Amulet", type: "amulet-gloves", slots: 2}, {name: "Gloves", type: "amulet-gloves", slots: 2},
            {name: "Ring 1", type: "normal", slots: 2}, {name: "Ring 2", type: "normal", slots: 2},
            {name: "Focus", type: "normal", slots: 1}, {name: "Weapon", type: "normal", slots: 1}
        ];

        let container = document.getElementById('gear-container');

        gearData.forEach(g => {
            let html = `<div class="gear" data-type="${g.type}"><h2>${g.name}</h2>`;
            for(let i=1; i<=g.slots; i++) {
                html += `<div class="slot-container" data-hammer="false" data-star="false">
                    <span class="slot-name">S${i}:</span>
                    <select class="dmg-select" onchange="calculateDamage()"></select>
                    <button class="btn-tiny hammer-btn" onclick="toggleHammer(this)">🔨</button>
                    <button class="btn-tiny star-btn" onclick="toggleStar(this)">✵</button>
                </div>`;
            }
            container.innerHTML += html + `</div>`;
        });

        function updateDropdowns() {
            let stats = { ...baseStats };
            if(isCritMode) { delete stats["Damage Over Time"]; stats["Crit Damage"] = { normal: 25, amuletGloves: 50 }; }
            document.querySelectorAll('.dmg-select').forEach(s => {
                const type = s.closest('.gear').dataset.type;
                let cur = s.value;
                s.innerHTML = '<option value="0">Choose...</option>';
                for (let [name, vals] of Object.entries(stats)) {
                    let val = Math.round((type === 'amulet-gloves' ? vals.amuletGloves : vals.normal) * (globalUpgradeActive ? 1.25 : 1));
                    let opt = new Option(`${name} (${val}%)`, val);
                    opt.dataset.base = Math.round(type === 'amulet-gloves' ? vals.amuletGloves : vals.normal);
                    opt.dataset.name = name;
                    s.add(opt);
                }
                s.value = cur;
            });
            calculateDamage();
        }

        function toggleHammer(btn) {
            let cont = btn.parentElement, piece = cont.parentElement;
            let isActive = cont.dataset.hammer === "true";
            
            if(!isActive) {
                // Turn this hammer ON
                piece.querySelectorAll('.hammer-btn').forEach(b => b.disabled = true);
                btn.disabled = false;
                cont.dataset.hammer = "true";
                btn.classList.add('active');
            } else {
                // Turn this hammer OFF
                piece.querySelectorAll('.hammer-btn').forEach(b => b.disabled = false);
                cont.dataset.hammer = "false";
                btn.classList.remove('active');
            }
            calculateDamage();
        }

        function toggleStar(btn) {
            let cont = btn.parentElement;
            cont.dataset.star = cont.dataset.star === "true" ? "false" : "true";
            btn.classList.toggle('active');
            calculateDamage();
        }

        function applyOptimal() {
            document.querySelectorAll('.gear').forEach(piece => {
                let slots = Array.from(piece.querySelectorAll('.slot-container'));
                let bestPieceMult = 0, bestPieceConfig = null;
                let statKeys = isCritMode ? [...Object.keys(baseStats).filter(k=>k!=="Damage Over Time"), "Crit Damage"] : Object.keys(baseStats);

                for(let s1 of statKeys) {
                    for(let s2 of (slots.length > 1 ? statKeys : [null])) {
                        if(slots.length > 1 && s1 === s2) continue;
                        for(let h=0; h<slots.length; h++) {
                            for(let st=0; st<slots.length; st++) {
                                slots.forEach((slot, idx) => {
                                    slot.querySelector('select').value = slot.querySelector(`option[data-name="${idx==0?s1:s2}"]`).value;
                                    slot.dataset.hammer = (idx === h);
                                    slot.dataset.star = (idx === st);
                                });
                                let m = getMultiplier().total;
                                if(m > bestPieceMult) { bestPieceMult = m; bestPieceConfig = {stats:[s1, s2], h, st}; }
                            }
                        }
                    }
                }
                slots.forEach((s, idx) => {
                    let name = idx==0 ? bestPieceConfig.stats[0] : bestPieceConfig.stats[1];
                    s.querySelector('select').value = s.querySelector(`option[data-name="${name}"]`).value;
                    s.dataset.hammer = (idx === bestPieceConfig.h);
                    s.dataset.star = (idx === bestPieceConfig.st);
                    s.querySelector('.hammer-btn').classList.toggle('active', idx === bestPieceConfig.h);
                    s.querySelector('.hammer-btn').disabled = (bestPieceConfig.h !== -1 && idx !== bestPieceConfig.h);
                    s.querySelector('.star-btn').classList.toggle('active', idx === bestPieceConfig.st);
                });
            });
            calculateDamage();
        }

        function getMultiplier() {
            let sums = { "Cold Damage": 0, "Vulnerable Damage": 0, "Damage Over Time": 0, "Crit Damage": 0, "All Damage": 0 };
            document.querySelectorAll('.slot-container').forEach(c => {
                let s = c.querySelector('select');
                if (s.selectedIndex > 0) {
                    let b = parseFloat(s.options[s.selectedIndex].dataset.base);
                    let n = s.options[s.selectedIndex].dataset.name;
                    let mult = 1 + (c.dataset.hammer === "true" ? 0.25 : 0) + (c.dataset.star === "true" ? 0.50 : 0) + (globalUpgradeActive ? 0.25 : 0);
                    sums[n] += Math.round(b * mult);
                }
            });
            return {
                total: (1 + sums["Cold Damage"]/100) * (1 + sums["Vulnerable Damage"]/100) * (1 + (sums["Damage Over Time"] + sums["Crit Damage"])/100) * (1 + sums["All Damage"]/100),
                sums: sums
            };
        }

        function calculateDamage() {
            let data = getMultiplier();
            document.querySelectorAll('.slot-container').forEach(c => {
                let s = c.querySelector('select');
                if(s.selectedIndex > 0) {
                    let b = parseFloat(s.options[s.selectedIndex].dataset.base);
                    let n = s.options[s.selectedIndex].dataset.name;
                    let mult = 1 + (c.dataset.hammer === "true" ? 0.25 : 0) + (c.dataset.star === "true" ? 0.50 : 0) + (globalUpgradeActive ? 0.25 : 0);
                    let val = Math.round(b * mult);
                    s.options[s.selectedIndex].text = `${n} (+${val}%)`;
                }
            });
            document.getElementById('result').innerHTML = `
                <div>Total Multiplier: <b>x${data.total.toFixed(2)}</b></div>
                <div style="margin-top:10px; font-size:0.8em">
                    <span class="bucket blue">Cold: +${data.sums["Cold Damage"]}%</span>
                    <span class="bucket purple">Vuln: +${data.sums["Vulnerable Damage"]}%</span>
                    <span class="bucket yellow">DoT/Crit: +${(data.sums["Damage Over Time"] + data.sums["Crit Damage"])}%</span>
                    <span class="bucket grey">All: +${data.sums["All Damage"]}%</span>
                </div>`;
        }

        function switchStats() { isCritMode = !isCritMode; document.getElementById('switch-btn').innerText = isCritMode ? "Switch to DoT" : "Switch to Crit"; updateDropdowns(); }
        function clearAll() { document.querySelectorAll('.dmg-select').forEach(s => s.selectedIndex = 0); document.querySelectorAll('.btn-tiny').forEach(b => { b.classList.remove('active'); b.disabled = false; }); document.querySelectorAll('.slot-container').forEach(c => { c.dataset.hammer = "false"; c.dataset.star = "false"; }); calculateDamage(); }
        function toggleGlobalUpgrade() { globalUpgradeActive = !globalUpgradeActive; document.getElementById('global-btn').style.background = globalUpgradeActive ? "#d32f2f" : "#444"; updateDropdowns(); }
        
        updateDropdowns();
    </script>
</body>
</html>
    
  </body>
  
</html>
